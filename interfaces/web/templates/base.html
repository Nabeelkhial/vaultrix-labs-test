<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<script>document.documentElement.className="js"</script>
<title>{% block title %}Vaultrix Labs — threat console{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
{% from "_icons.html" import icon with context %}
<div class="topbar">
  <a class="brand" href="/" style="color:inherit">
    {{ icon('shield-check','') }}<span>VAULTRIX<span class="mark">//</span>LABS</span>
    <span class="tag-ver">CSO&nbsp;v0.5</span>
  </a>
  <div class="who">
    {% if user %}
      <span class="handle">{{ icon('github') }}</span><span class="handle">@{{ user.login }}</span>
      <form method="post" action="/logout" style="margin:0">
        <button class="btn ghost sm">Sign out</button></form>
    {% endif %}
  </div>
</div>
<main>{% block body %}{% endblock %}</main>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body></html>
